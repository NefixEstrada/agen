# The stream half of the redis 0.2.0 binding README example, declared via the
# x-redis specification extension (the binding version is a draft, not
# published yet, so agen reads the fields from the extension). The pubsub half
# lives in ../redis_pubsub: agen does not mix stream and pubsub channels in
# one service yet.
asyncapi: 3.0.0
info:
  title: Redis Binding API
  version: 1.0.0
servers:
  production:
    host: redis.example.io:6379
    protocol: redis
channels:
  events:
    address: app:events
    x-redis: { type: stream, maxLen: 1, bindingVersion: '0.2.0' }
    messages:
      event:
        payload:
          type: object
          properties:
            id: { type: string }
          required: [id]
  notifications:
    address: app:notifications
    x-redis: { type: stream }
    messages:
      note:
        payload: { type: string }
operations:
  publishEvent:
    action: send
    channel: { $ref: '#/channels/events' }
  publishNote:
    action: send
    channel: { $ref: '#/channels/notifications' }
  consumeEvent:
    action: receive
    channel: { $ref: '#/channels/events' }
    x-redis: { consumerGroup: my-service, bindingVersion: '0.2.0' }
