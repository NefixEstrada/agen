asyncapi: 3.0.0
info:
  title: Extensions API
  version: 1.0.0
servers:
  production:
    host: redis.example.io:6379
    protocol: redis
channels:
  telemetry:
    address: telemetry.{deviceId}
    x-redis: { type: stream }
    parameters:
      deviceId:
        description: The device identifier.
    messages:
      reading:
        x-agen-name: DeviceReading
        payload:
          type: object
          properties:
            deviceId:
              type: string
            measuredAt:
              type: string
              format: date-time
              x-agen-time-format: "2006-01-02 15:04:05"
            seenAt:
              type: string
              format: unix
          required: [deviceId, measuredAt, seenAt]
  users:
    address: users
    x-redis: { type: stream }
    messages:
      created:
        payload:
          type: object
          x-agen-validate:
            crossField: { separator: "-" }
          properties:
            email:
              type: string
              x-agen-validate:
                corporate: true
            handle:
              type: string
              x-agen-validate:
                reservedHandles: [admin, root]
          required: [email, handle]
operations:
  receiveTelemetry:
    action: receive
    x-redis: { consumerGroup: extensions-app }
    channel:
      $ref: '#/channels/telemetry'
  userCreated:
    action: receive
    x-redis: { consumerGroup: extensions-app }
    channel:
      $ref: '#/channels/users'
